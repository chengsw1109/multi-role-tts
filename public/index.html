<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多角色配音室</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">MULTI-ROLE TTS</p>
        <h1>多角色配音室</h1>
        <p>為每句台詞指定角色與聲音，逐段產生、試聽並下載 MP3。</p>
      </header>

      <section class="toolbar" aria-label="操作工具列">
        <button id="add-line" class="button secondary" type="button">＋ 新增台詞</button>
        <button id="generate-all" class="button primary" type="button">產生全部語音</button>
      </section>

      <section id="lines" class="lines" aria-live="polite"></section>

      <template id="line-template">
        <article class="line-card">
          <div class="line-head">
            <label>角色
              <input class="role" maxlength="32" placeholder="例如：旁白" />
            </label>
            <label>聲音
              <select class="voice">
                <option value="alloy">Alloy</option>
                <option value="echo">Echo</option>
                <option value="fable">Fable</option>
                <option value="onyx">Onyx</option>
                <option value="nova">Nova</option>
                <option value="shimmer">Shimmer</option>
              </select>
            </label>
            <label>語速
              <input class="speed" type="number" min="0.25" max="4" step="0.05" value="1" />
            </label>
            <label class="browser-voice-label">瀏覽器語音
              <select class="browser-voice" aria-label="選擇免費試聽語音"></select>
            </label>
            <button class="icon-button remove" type="button" aria-label="刪除這句台詞">×</button>
          </div>
          <label class="dialogue-label">台詞
            <textarea class="text" maxlength="4096" rows="4" placeholder="輸入要朗讀的文字…"></textarea>
          </label>
          <div class="line-footer">
            <span class="status">尚未產生</span>
            <div class="audio-actions">
              <audio class="player" controls hidden></audio>
              <a class="download" hidden>下載 MP3</a>
              <button class="button preview" type="button">免費試聽</button>
              <button class="button generate-one" type="button">產生語音</button>
            </div>
          </div>
        </article>
      </template>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
