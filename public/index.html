<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故事語音</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">BROWSER STORY VOICE</p>
        <h1>故事語音</h1>
        <p>貼上完整故事，免費使用電腦內建語音朗讀。系統會自動區分旁白與引號中的對話。</p>
      </header>

      <section class="story-import" aria-labelledby="story-import-title">
        <div>
          <p class="section-kicker">整篇故事</p>
          <h2 id="story-import-title">貼上故事，直接免費朗讀</h2>
          <p>旁白和「」中的對話會在背景自動分類依序朗讀，不會顯示或要求你設定各角色。說話者會依「某某說／喊／回應」等前後文推測；未明示時會以同一語音朗讀。</p>
        </div>
        <label class="story-label">故事內容
          <textarea id="story-input" rows="10" placeholder="將整篇故事貼在這裡，例如：&#10;「你好。」小安說。&#10;&#10;小安走進房間，看見窗外正下著雨。"></textarea>
        </label>
        <div class="voice-settings" aria-label="語音設定">
          <label>聲音
            <select id="voice-mode">
              <option value="classified">自動分類朗讀</option>
              <option value="single">統一使用同一聲音</option>
            </select>
          </label>
          <label>語速
            <input id="story-speed" type="number" min="0.25" max="4" step="0.05" value="1" />
          </label>
          <label class="browser-voice-label">瀏覽器語音
            <select id="browser-voice" aria-label="選擇瀏覽器內建語音"></select>
          </label>
        </div>
        <div class="story-actions">
          <button id="story-voice" class="button primary" type="button">語音</button>
          <span id="story-status" class="story-status">完全免費，不會呼叫 API，也不會建立音檔。</span>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
